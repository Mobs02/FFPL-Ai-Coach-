<!--
  Supabase Dashboard → Authentication → Email Templates → "Reset Password"
  Paste this into the "Message body" field (subject can stay as-is or be
  set to: "Reset your SquadScout AI password").
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:14px;overflow:hidden;font-family:Arial,sans-serif;">
  <tr>
    <td style="background:#37003c;padding:24px 28px;">
      <table role="presentation" cellpadding="0" cellspacing="0">
        <tr>
          <td style="padding-right:10px;">
            <img src="https://ffpl-ai-coach.vercel.app/logo-icon.png" width="30" height="30" alt="" style="display:block;border-radius:7px;">
          </td>
          <td style="font-family:Arial,sans-serif;font-weight:700;font-size:17px;color:#ffffff;">
            SquadScout<span style="color:#00ff85;"> AI</span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td style="padding:28px 28px 8px;">
      <h1 style="margin:0 0 16px;font-size:20px;color:#1a0c1d;">Reset your password</h1>
      <p style="margin:0 0 22px;font-size:14px;line-height:1.6;color:#4a3a4d;">
        Click below to choose a new password for your SquadScout AI account.
      </p>
    </td>
  </tr>
  <tr>
    <td style="padding:0 28px 28px;">
      <a href="{{ .ConfirmationURL }}" style="display:block;text-align:center;background:#37003c;color:#ffffff;text-decoration:none;font-weight:600;font-size:14px;padding:13px;border-radius:8px;">
        Reset my password
      </a>
    </td>
  </tr>
  <tr>
    <td style="padding:16px 28px;background:#f8f5f9;font-size:11.5px;color:#9a8a9e;">
      If you didn't request this, you can safely ignore this email — your password won't change.
    </td>
  </tr>
</table>
