name: Poll FPL
on:
  schedule:
    - cron: "0 12-23 * * *"          # once an hour, 12:00-23:00 UTC, every day — fixtures can land on any day (midweek rounds, rearranged games), not just Sat/Sun/Mon
    - cron: "0 9 * * *"              # once daily, every day, 9:00 UTC — catches deadline changes and settles overnight results
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the snapshot endpoint
        run: |
          curl -sf -X GET "${{ vars.APP_URL }}/api/cron/snapshot" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
